<style>
body{margin:0;background:#FAF7F2}
a{color:#171615}a:hover{color:#000000}
.os{font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;color:#171615;font-size:18px;line-height:1.6;background:#FAF7F2;min-width:0;overflow-x:clip}
.os *{box-sizing:border-box}
.os h1,.os h2,.os h3{text-wrap:balance}
.os p{text-wrap:pretty}
.os a:focus-visible,.os button:focus-visible,.os input:focus-visible,.os select:focus-visible,.os textarea:focus-visible,.os summary:focus-visible{outline:3px solid #171615;outline-offset:3px}
.dk a:focus-visible,.dk button:focus-visible,.dk summary:focus-visible,.dk select:focus-visible{outline-color:#FAF7F2}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.disp{font-family:'Unbounded','Onest',system-ui,sans-serif;font-weight:500;letter-spacing:-.025em}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px}
.sec{padding:136px 0}
.kick{display:flex;align-items:center;gap:12px;margin:0;font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#55504A}
.kick::before{content:"";width:10px;height:10px;flex:none;background:#8FB8C4;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.dk .kick{color:#BDB5A8}
.h2{margin:0;font-size:clamp(32px,3.9vw,56px);line-height:1.08}
.lead{margin:0;font-size:20px;line-height:1.6;color:#4A453F}
.dk .lead{color:#C9C1B4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:58px;padding:0 30px;border-radius:8px;font:inherit;font-weight:600;font-size:17px;text-decoration:none;cursor:pointer;border:0;transition:background .18s,color .18s,transform .18s,box-shadow .18s;text-align:center}
.btn:active{transform:translateY(1px)}
.btn-p{background:#1F4E5F;color:#FFFFFF}.btn-p:hover{background:#163A47;color:#FFFFFF}
.btn-ol{background:transparent;color:#FAF7F2;box-shadow:inset 0 0 0 1.5px rgba(250,247,242,.5)}.btn-ol:hover{background:#FAF7F2;color:#171615}
.btn-o{background:transparent;color:#171615;box-shadow:inset 0 0 0 1.5px #171615}.btn-o:hover{background:#171615;color:#FAF7F2}
.ar{display:inline-block;transition:transform .2s}
a:hover .ar,button:hover .ar{transform:translateX(4px)}
.lnk{display:inline-flex;align-items:center;gap:10px;font-weight:600;min-height:48px;text-decoration:none;color:inherit;border-bottom:2px solid currentColor;align-self:flex-start}
.nl{color:#171615;text-decoration:none;font-size:16px;font-weight:500;padding:8px 0;background:none;border:0;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;position:relative}
.nl::after{content:"";position:absolute;left:0;right:100%;bottom:2px;height:2px;background:#8FB8C4;transition:right .2s}
.nl:hover::after,.nl[aria-expanded="true"]::after{right:0}
.tbar{background:#0F0E0D;color:#D9D2C6;font-size:15px}
.tin{min-height:48px;display:flex;align-items:center;gap:28px}
.tin a{color:#D9D2C6;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.tin a:hover{color:#FFFFFF}
.tsoc{margin-left:auto;display:flex;align-items:center;gap:4px}
.tsoc a{width:44px;justify-content:center;border-radius:50%}
.tsoc a:hover{background:#2B2926}
.tsep{width:1px;height:20px;background:#3A3733}
.taddr{display:inline-flex;align-items:center;gap:8px}
@media (max-width:760px){.taddr,.tsep{display:none}.tsoc a{width:40px}.tin{gap:8px}.tin{font-size:14px}}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:12px}
.citem{display:flex;gap:16px;align-items:center;padding:18px 20px;border-radius:14px;background:#211F1D;box-shadow:inset 0 0 0 1px #34312D;color:#FAF7F2;text-decoration:none;min-height:84px;transition:background .18s,box-shadow .18s}
a.citem:hover{background:#2A2825;box-shadow:inset 0 0 0 1px #8FB8C4;color:#FFFFFF}
.cic{flex:none;width:48px;height:48px;border-radius:50%;background:#2B2926;color:#8FB8C4;display:grid;place-items:center}
.ctx{display:flex;flex-direction:column;min-width:0}
.clab{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#9D968A}
.cval{font-size:18px;font-weight:600;overflow-wrap:anywhere}
.cpill{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 18px;border-radius:24px;box-shadow:inset 0 0 0 1px #4A4640;color:#FAF7F2;text-decoration:none;font-weight:600;font-size:16px}
.cpill:hover{background:#FAF7F2;color:#171615}
.fcon a,.fcon span{display:flex;gap:10px;align-items:flex-start}
.bc ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 10px;font-size:15px;color:#6B655C}
.bc li{display:flex;align-items:center;gap:10px}
.bc li+li::before{content:"/";color:#B9AE9E}
.bc a{color:#55504A;text-decoration:none;min-height:32px;display:inline-flex;align-items:center}
.bc a:hover{text-decoration:underline}
.bc [aria-current]{color:#171615;font-weight:600}
.tagp{display:inline-flex;align-items:center;min-height:46px;padding:0 20px;border-radius:24px;background:#FFFFFF;box-shadow:inset 0 0 0 1px #D6CBB9;font-size:16px;font-weight:500}
.qk{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;min-height:76px;padding:14px 20px;border-radius:16px;background:#FFFFFF;box-shadow:inset 0 0 0 1px #E5DCCD;text-decoration:none;color:#171615;font-size:17px;font-weight:600;transition:box-shadow .2s,transform .2s}
.qk svg{color:#1F4E5F}.qk:hover{box-shadow:inset 0 0 0 1.5px #171615;transform:translateY(-2px)}
.qkl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ssrch{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 8px 0 22px;border-radius:34px;background:#FFFFFF;box-shadow:inset 0 0 0 1.5px #D6CBB9;max-width:640px}
.ssrch:focus-within{box-shadow:inset 0 0 0 2px #171615}
.ssrch input{border:0;outline:0;background:transparent;font:inherit;font-size:18px;flex:1;min-width:0;width:100%;height:60px}
.e404g>*{min-width:0}
.ssrch button{min-height:50px;border-radius:26px}
@media (max-width:760px){.qkl{grid-template-columns:1fr}.ssrch button{padding:0 16px}}
.e404{padding:88px 0 96px}
.e404g{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:64px;align-items:center}
.big404{position:relative;aspect-ratio:1/1;border-radius:28px;background:#171615;display:grid;place-items:center;overflow:hidden}
.big404 span{font-size:clamp(80px,12vw,180px);color:#FAF7F2;font-weight:300;letter-spacing:-.05em;position:relative}
.big404 img{position:absolute;width:85%;opacity:.07}
@media (max-width:1100px){.e404g{grid-template-columns:1fr}.big404{aspect-ratio:16/9;max-width:560px}}
@media (max-width:760px){.e404{padding:48px 0 72px}}
.hdr{position:sticky;top:0;z-index:45;background:rgba(250,247,242,.97);backdrop-filter:blur(10px);transition:box-shadow .25s}
.hdr.on{box-shadow:0 1px 0 #E5DCCD,0 10px 30px rgba(23,22,21,.06)}
.hin{height:92px;display:flex;align-items:center;gap:44px;transition:height .25s}
.hdr.on .hin{height:74px}
.hero{position:relative;background:#171615;color:#FAF7F2;overflow:hidden}
.hero-mark{position:absolute;right:-170px;top:-60px;width:820px;opacity:.06;pointer-events:none}
.hero-glow{position:absolute;right:-200px;top:-200px;width:900px;height:900px;background:radial-gradient(circle,rgba(143,184,196,.14),rgba(143,184,196,0) 62%);pointer-events:none}
.hgrid{position:relative;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.9fr);gap:72px;align-items:center;padding-top:104px;padding-bottom:96px}
.qpanel{background:#211F1D;border-radius:16px;box-shadow:inset 0 0 0 1px #34312D;padding:32px;display:flex;flex-direction:column;gap:6px}
.qlink{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:60px;padding:0 4px;border-bottom:1px solid #34312D;color:#FAF7F2;text-decoration:none;font-size:18px;font-weight:500}
.qlink:hover{color:#FFFFFF}
.qlink:hover .ar{color:#8FB8C4}
.facts{position:relative;border-top:1px solid #34312D;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.fact{padding:28px 32px 32px 0;display:flex;gap:16px;align-items:flex-start;font-size:17px;color:#D9D2C6}
.fact strong{display:block;color:#FAF7F2;font-size:18px}
.track{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:40px;padding:8px 40px 32px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 clamp(300px,calc((min(100vw,1320px) - 152px) / 3.25),420px);scroll-snap-align:start;border-radius:16px;padding:36px 32px 32px;min-height:500px;display:flex;flex-direction:column;gap:18px;transition:transform .25s,box-shadow .25s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-6px);box-shadow:0 24px 44px rgba(23,22,21,.12)}
.c-w{background:#FFFFFF;box-shadow:inset 0 0 0 1px #E5DCCD}
.c-g{background:#171615;color:#FAF7F2}
.c-s{background:#E8DDCC}
.c-t{background:#1F4E5F;color:#FFFFFF}
.cnum{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:500;opacity:.75}
.ctags{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:16px}
.ctags li{display:flex;gap:10px;align-items:baseline}
.ctags li::before{content:"";width:6px;height:6px;flex:none;background:currentColor;opacity:.55;transform:translateY(-2px) rotate(45deg)}
.cbg{position:absolute;right:-60px;bottom:-60px;width:220px;opacity:.07;pointer-events:none}
.ctrl{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#FFFFFF;border:0;box-shadow:inset 0 0 0 1.5px #171615;color:#171615;cursor:pointer;transition:background .18s,color .18s}
.ctrl:hover{background:#171615;color:#FAF7F2}
.split-l{padding:128px 72px 128px 0;display:flex;flex-direction:column;gap:28px;border-right:1px solid #EFE7DA}
.split-r{list-style:none;margin:0;padding:96px 0 96px 72px;display:flex;flex-direction:column;justify-content:center}
.step{position:relative;padding-top:36px;display:flex;flex-direction:column;gap:14px}
.step::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:#E5DCCD}
.step::after{content:"";position:absolute;left:0;top:0;height:2px;width:0;background:#1F4E5F;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.step:hover::after{width:100%}
.stepn{font-family:'Unbounded',sans-serif;font-size:72px;line-height:1;font-weight:300;letter-spacing:-.04em;color:#171615;transition:color .3s}
.step:hover .stepn{color:#1F4E5F}
.zgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:72px;align-items:start}
.zstick{position:sticky;top:120px}
.fcols{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(4,minmax(0,1fr));gap:48px 40px;border-top:1px solid #2B2926;padding-top:64px}
.os details>summary{list-style:none;cursor:pointer}
.os details>summary::-webkit-details-marker{display:none}
.pm{flex:none;width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #171615;display:grid;place-items:center;transition:transform .25s,background .25s,color .25s}
.os details[open] .pm{transform:rotate(45deg);background:#171615;color:#FAF7F2}
.fld{display:flex;flex-direction:column;gap:8px}
.fld label{font-weight:600;font-size:16px}
.inp{height:58px;border-radius:8px;background:#FAF7F2;color:#171615;padding:0 16px;font:inherit;font-size:17px;width:100%}
.err{font-size:15px;color:#B3261E;display:flex;gap:6px;align-items:flex-start;font-weight:500}
.fab{position:fixed;right:28px;bottom:28px;z-index:40;display:flex;align-items:center;gap:10px;height:60px;padding:0 24px 0 20px;border-radius:30px;background:#171615;color:#FAF7F2;text-decoration:none;font-weight:600;font-size:16px;box-shadow:0 12px 30px rgba(0,0,0,.28);transition:transform .2s,background .2s}
.fab:hover{color:#FFFFFF;transform:translateY(-2px);background:#000000}
.rail{position:fixed;left:22px;top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;align-items:center;gap:10px}
.rail a{width:44px;height:44px;display:grid;place-items:center;color:#171615;border-radius:50%;background:rgba(250,247,242,.94);box-shadow:inset 0 0 0 1px #D6CBB9}
.rail a:hover{background:#171615;color:#FAF7F2}
.mbar{display:none}
.burger{display:none}
.navd{display:flex}
.mpanel{position:fixed;inset:0;z-index:60;background:#FAF7F2;overflow-y:auto;display:flex;flex-direction:column}
@supports (animation-timeline: view()){@media (prefers-reduced-motion:no-preference){.rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% entry 35%}@keyframes rv{from{opacity:.001;transform:translateY(28px)}to{opacity:1;transform:none}}}}
@media (prefers-reduced-motion:reduce){.os *{transition:none!important;animation:none!important}}
@media (max-width:1439px){.rail{display:none}}
@media (max-width:1100px){.navd{display:none}.burger{display:grid}.hgrid{grid-template-columns:1fr;gap:48px}.qpanel{max-width:620px}.fcols{grid-template-columns:repeat(2,minmax(0,1fr))}.fcols>:first-child{grid-column:1 / -1}.zgrid{grid-template-columns:1fr;gap:40px}.zstick{position:static}.split-l{padding:96px 0 32px;border-right:0}.split-r{padding:0 0 96px}}
@media (max-width:760px){
.wrap{padding:0 20px}.sec{padding:88px 0}
.hide-sm{display:none}
.fab{display:none}
.mbar{display:grid;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;grid-template-columns:1fr 1fr;gap:8px;padding:8px;background:#171615;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.mbar-sp{height:96px}
.hin{height:72px;gap:16px}.hdr.on .hin{height:64px}
.hero-mark{width:420px;right:-150px;top:-40px;opacity:.08}
.hgrid{padding-top:56px;padding-bottom:48px;gap:40px}
.qpanel{padding:20px;border-radius:12px}.qlink{font-size:17px;min-height:56px}
.facts{grid-template-columns:1fr}.fact{padding:20px 0;border-bottom:1px solid #34312D}
.track{padding:8px 20px 24px;scroll-padding-left:20px;gap:14px}
.card{flex-basis:84%;min-height:440px;padding:28px 24px}
.ctrls{display:none}
.lead{font-size:18px}
.stepn{font-size:56px}
.btn{width:100%}
.split-l{padding:80px 0 24px}.split-r{padding:0 0 80px}
.fcols{grid-template-columns:1fr 1fr;gap:40px 24px;padding-top:48px}
}
</style>
