services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      # Live chat (wp-content/themes/osteza/inc/chat.php); values in .env
      OSTEZA_OPENAI_KEY: ${OSTEZA_OPENAI_KEY:-}
      OSTEZA_CHAT_MODEL: ${OSTEZA_CHAT_MODEL:-}
      OSTEZA_TG_TOKEN: ${OSTEZA_TG_TOKEN:-}
      OSTEZA_TG_CHAT: ${OSTEZA_TG_CHAT:-}
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
volumes:
  db_data:
